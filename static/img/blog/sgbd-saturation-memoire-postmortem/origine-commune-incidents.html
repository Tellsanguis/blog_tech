<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trois symptômes, une origine commune</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #faf7f2;
    --color-ink:    #1c1917;
    --color-muted:  #4f5d75;
    --color-accent: #2e8555;
    --font-sans:  'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1000px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 700px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Post-mortem · SGBD</p>
    <h1>Trois symptômes, une seule origine</h1>

    <svg viewBox="0 0 820 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hfsql-title hfsql-desc">
      <title id="hfsql-title">Trois symptômes, une origine commune</title>
      <desc id="hfsql-desc">Le job de sauvegarde interne nocturne du moteur SGBD produit trois effets distincts : la RAM du moteur monte à 60 Go et redémarre, des centaines de Go d'archives locales s'accumulent, et ces archives surchargent la sauvegarde externe jusqu'à bloquer le serveur.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e8555"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf7f2"/>

      <!-- Arrows (behind nodes) -->
      <!-- Arrow 1: root -> C1 (right+up elbow) -->
      <path d="M 280,240 H 392 Q 400,240 400,232 V 140 Q 400,132 408,132 H 520"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Arrow 2: root -> C2 (straight, same y) -->
      <line x1="280" y1="280" x2="520" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Arrow 3: root -> C3 (right+down elbow, accent = the path that caused the outage) -->
      <path d="M 280,320 H 392 Q 400,320 400,328 V 420 Q 400,428 408,428 H 520"
            fill="none" stroke="#2e8555" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="406" y="180" width="34" height="12" rx="2" fill="#faf7f2"/>
      <text x="410" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MEM</text>

      <rect x="380" y="260" width="40" height="12" rx="2" fill="#faf7f2"/>
      <text x="400" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISQUE</text>

      <rect x="406" y="368" width="32" height="12" rx="2" fill="#faf7f2"/>
      <text x="410" y="377" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SYNC</text>

      <!-- Node: root cause (focal) -->
      <rect x="60" y="200" width="220" height="160" rx="6" fill="#faf7f2"/>
      <rect x="60" y="200" width="220" height="160" rx="6" fill="rgba(46,133,85,0.12)" stroke="#2e8555" stroke-width="1"/>
      <rect x="68" y="210" width="36" height="12" rx="2" fill="transparent" stroke="rgba(46,133,85,0.50)" stroke-width="0.8"/>
      <text x="86" y="219" fill="#2e8555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRON</text>
      <text x="170" y="270" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sauvegarde interne</text>
      <text x="170" y="286" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SGBD</text>
      <text x="170" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2h-4h · relit 131 Go</text>
      <text x="170" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~1 Go RAM / min</text>

      <!-- Node: C1 RAM (store) -->
      <rect x="520" y="100" width="220" height="64" rx="6" fill="#faf7f2"/>
      <rect x="520" y="100" width="220" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="528" y="108" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="542" y="117" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEM</text>
      <text x="630" y="136" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RAM à 60 Go</text>
      <text x="630" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">redémarrage 4h17</text>

      <!-- Node: C2 Disque (store) -->
      <rect x="520" y="248" width="220" height="64" rx="6" fill="#faf7f2"/>
      <rect x="520" y="248" width="220" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="528" y="256" width="30" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="543" y="265" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
      <text x="630" y="284" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">486 Go d'archives</text>
      <text x="630" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 jours conservés</text>

      <!-- Node: C3 Sauvegarde NAS (backend, outcome) -->
      <rect x="520" y="396" width="220" height="64" rx="6" fill="#faf7f2"/>
      <rect x="520" y="396" width="220" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="528" y="404" width="30" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="543" y="413" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
      <text x="630" y="432" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sauvegarde NAS</text>
      <text x="630" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">surchargée → blocage</text>

      <!-- Legend strip -->
      <line x1="40" y1="500" x2="780" y2="500" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="532" width="14" height="10" rx="2" fill="rgba(46,133,85,0.12)" stroke="#2e8555" stroke-width="1"/>
      <text x="60" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / cause</text>

      <rect x="200" y="532" width="14" height="10" rx="2" fill="rgba(28,25,23,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="220" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Effet / store</text>

      <rect x="360" y="532" width="14" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="380" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Effet observé</text>

      <line x1="520" y1="537" x2="548" y2="537" stroke="#2e8555" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="556" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">A déclenché l'incident du 12 août</text>
    </svg>
  </div>
</body>
</html>
