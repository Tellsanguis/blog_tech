<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sshcert-title sshcert-desc">
      <title id="sshcert-title">Émission d'un certificat SSH éphémère via Entra ID</title>
      <desc id="sshcert-desc">Un admin s'authentifie via OIDC auprès d'Entra ID, step-ca signe un certificat SSH de 10 heures à partir des claims du jeton, et ce certificat est présenté à la VM cible.</desc>
      <defs>
<style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e8555"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf7f2"/>

      <!-- Zone: CA SSH ephemeral trust boundary (drawn before arrows/nodes) -->
      <rect x="400" y="188" width="400" height="116" rx="8"
            fill="rgba(46,133,85,0.03)" stroke="rgba(46,133,85,0.25)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="555" y="192" width="90" height="12" rx="2" fill="#faf7f2"/>
      <text x="600" y="201" fill="rgba(46,133,85,0.65)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.10em">CA SSH · 10H</text>

      <!-- Arrows (behind nodes) -->
      <line x1="180" y1="252" x2="220" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="380" y1="252" x2="420" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="580" y1="252" x2="620" y2="252" stroke="#2e8555" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="780" y1="252" x2="820" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="182" y="232" width="36" height="12" rx="2" fill="#faf7f2"/>
      <text x="200" y="242" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOGIN</text>

      <rect x="380" y="232" width="40" height="12" rx="2" fill="#faf7f2"/>
      <text x="400" y="242" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIMS</text>

      <rect x="584" y="232" width="32" height="12" rx="2" fill="#faf7f2"/>
      <text x="600" y="242" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGN</text>

      <rect x="786" y="232" width="28" height="12" rx="2" fill="#faf7f2"/>
      <text x="800" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SSH</text>

      <!-- Node: Admin (input) -->
      <rect x="40" y="220" width="140" height="64" rx="6" fill="#faf7f2"/>
      <rect x="40" y="220" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
      <text x="110" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admin</text>
      <text x="110" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">poste local</text>

      <!-- Node: Entra ID (external) -->
      <rect x="220" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="220" y="220" width="160" height="64" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <rect x="228" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.22)" stroke-width="0.8"/>
      <text x="242" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDP</text>
      <text x="300" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Entra ID</text>
      <text x="300" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OIDC + MFA</text>

      <!-- Node: step-ca (focal) -->
      <rect x="420" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="420" y="220" width="160" height="64" rx="6" fill="rgba(46,133,85,0.12)" stroke="#2e8555" stroke-width="1"/>
      <rect x="428" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(46,133,85,0.50)" stroke-width="0.8"/>
      <text x="442" y="237" fill="#2e8555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CA</text>
      <text x="500" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">step-ca</text>
      <text x="500" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CA SSH interne</text>

      <!-- Node: Certificat SSH (store) -->
      <rect x="620" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="620" y="220" width="160" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="628" y="228" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="644" y="237" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CERT</text>
      <text x="700" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Certificat SSH</text>
      <text x="700" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10h · principal</text>

      <!-- Node: VM cible (backend) -->
      <rect x="820" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="820" y="220" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="828" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="842" y="237" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VM</text>
      <text x="900" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VM cible</text>
      <text x="900" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">principals file</text>

      <!-- Legend strip -->
      <line x1="40" y1="400" x2="1040" y2="400" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text x="40" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="432" width="14" height="10" rx="2" fill="rgba(46,133,85,0.12)" stroke="#2e8555" stroke-width="1"/>
      <text x="60" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / CA</text>

      <rect x="180" y="432" width="14" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="200" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

      <rect x="300" y="432" width="14" height="10" rx="2" fill="rgba(28,25,23,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <rect x="400" y="432" width="14" height="10" rx="2" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <text x="420" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External</text>

      <line x1="520" y1="437" x2="548" y2="437" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="556" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Identité / OIDC</text>

      <line x1="700" y1="437" x2="728" y2="437" stroke="#2e8555" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="736" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Signature</text>

      <line x1="860" y1="437" x2="888" y2="437" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="896" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Connexion</text>
    </svg>