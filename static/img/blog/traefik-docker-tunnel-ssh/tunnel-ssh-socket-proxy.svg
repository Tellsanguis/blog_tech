<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tunnel-title tunnel-desc">
      <title id="tunnel-title">Traefik, tunnel SSH et socket-proxy vers Docker</title>
      <desc id="tunnel-desc">Le trafic entrant atteint Traefik en zone DMZ, qui traverse un tunnel SSH restreint pour rejoindre un socket-proxy filtrant en zone backend, lequel seul peut dialoguer avec le socket Docker.</desc>
      <defs>
<style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e8555"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf7f2"/>

      <!-- Zones (drawn before arrows/nodes) -->
      <rect x="200" y="188" width="200" height="116" rx="8"
            fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="270" y="192" width="60" height="12" rx="2" fill="#faf7f2"/>
      <text x="300" y="201" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.12em">DMZ</text>

      <rect x="600" y="188" width="400" height="116" rx="8"
            fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="736" y="192" width="128" height="12" rx="2" fill="#faf7f2"/>
      <text x="800" y="201" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.12em">BACKEND · DOCKER01</text>

      <!-- Arrows -->
      <line x1="180" y1="252" x2="220" y2="252" stroke="#2e8555" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="380" y1="252" x2="420" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="252" x2="620" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="780" y1="252" x2="820" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="182" y="232" width="42" height="12" rx="2" fill="#faf7f2"/>
      <text x="200" y="242" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <rect x="384" y="232" width="28" height="12" rx="2" fill="#faf7f2"/>
      <text x="400" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TCP</text>

      <rect x="576" y="232" width="48" height="12" rx="2" fill="#faf7f2"/>
      <text x="600" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SOCKET</text>

      <rect x="786" y="232" width="28" height="12" rx="2" fill="#faf7f2"/>
      <text x="800" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API</text>

      <!-- Node: Trafic entrant (input) -->
      <rect x="40" y="220" width="140" height="64" rx="6" fill="#faf7f2"/>
      <rect x="40" y="220" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NET</text>
      <text x="110" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trafic entrant</text>
      <text x="110" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">80 / 443</text>

      <!-- Node: Traefik (focal) -->
      <rect x="220" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="220" y="220" width="160" height="64" rx="6" fill="rgba(46,133,85,0.12)" stroke="#2e8555" stroke-width="1"/>
      <rect x="228" y="228" width="24" height="12" rx="2" fill="transparent" stroke="rgba(46,133,85,0.50)" stroke-width="0.8"/>
      <text x="240" y="237" fill="#2e8555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LB</text>
      <text x="300" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traefik</text>
      <text x="300" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reverse proxy</text>

      <!-- Node: Tunnel SSH (security, dashed) -->
      <rect x="420" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="420" y="220" width="160" height="64" rx="6" fill="rgba(46,133,85,0.05)" stroke="#2e8555" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="428" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(46,133,85,0.50)" stroke-width="0.8"/>
      <text x="442" y="237" fill="#2e8555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSH</text>
      <text x="500" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tunnel SSH</text>
      <text x="500" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:2375</text>

      <!-- Node: Socket-proxy (backend) -->
      <rect x="620" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="620" y="220" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="628" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="642" y="237" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="700" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Socket-proxy</text>
      <text x="700" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">endpoints filtrés</text>

      <!-- Node: Docker (store) -->
      <rect x="820" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="820" y="220" width="160" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="828" y="228" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="844" y="237" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOCK</text>
      <text x="900" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Docker</text>
      <text x="900" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">socket rootless</text>

      <!-- Legend strip -->
      <line x1="40" y1="400" x2="1040" y2="400" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text x="40" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="432" width="14" height="10" rx="2" fill="rgba(46,133,85,0.12)" stroke="#2e8555" stroke-width="1"/>
      <text x="60" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / LB</text>

      <rect x="180" y="432" width="14" height="10" rx="2" fill="rgba(46,133,85,0.05)" stroke="#2e8555" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="200" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Canal restreint</text>

      <rect x="340" y="432" width="14" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="360" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

      <rect x="460" y="432" width="14" height="10" rx="2" fill="rgba(28,25,23,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <line x1="580" y1="437" x2="608" y2="437" stroke="#2e8555" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="616" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flux principal</text>

      <line x1="760" y1="437" x2="788" y2="437" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="796" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Interne</text>
    </svg>