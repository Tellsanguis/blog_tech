<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline ansible-pull avec vérification de signature</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #faf7f2;
    --color-ink:    #1c1917;
    --color-muted:  #4f5d75;
    --color-accent: #2e8555;
    --font-sans:  'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · GitOps pull-based</p>
    <h1>Le pipeline ansible-pull : rien ne s'exécute sans signature valide</h1>

    <svg viewBox="0 0 1080 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
      <title id="pipeline-title">Pipeline ansible-pull avec vérification de signature</title>
      <desc id="pipeline-desc">Une VM récupère le dépôt Git, vérifie la signature du tag deploy avant toute exécution, exécute le playbook seulement si la vérification passe, sinon abandonne sans rien exécuter.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e8555"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf7f2"/>

      <!-- Abort path: Vérification (top) back to VM (top), dashed -->
      <path d="M 500,220 V 188 Q 500,180 492,180 H 118 Q 110,180 110,188 V 220"
            fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="291" y="160" width="28" height="12" rx="2" fill="#faf7f2"/>
      <text x="305" y="170" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STOP</text>

      <!-- Main row arrows -->
      <line x1="180" y1="252" x2="220" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="252" x2="420" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="252" x2="620" y2="252" stroke="#2e8555" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="780" y1="252" x2="820" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="182" y="232" width="40" height="12" rx="2" fill="#faf7f2"/>
      <text x="200" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FETCH</text>

      <rect x="376" y="232" width="48" height="12" rx="2" fill="#faf7f2"/>
      <text x="400" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TAG+SIG</text>

      <rect x="586" y="232" width="28" height="12" rx="2" fill="#faf7f2"/>
      <text x="600" y="242" fill="#2e8555" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OK</text>

      <rect x="782" y="232" width="36" height="12" rx="2" fill="#faf7f2"/>
      <text x="800" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXEC</text>

      <!-- Node: VM (input) -->
      <rect x="40" y="220" width="140" height="64" rx="6" fill="#faf7f2"/>
      <rect x="40" y="220" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VM</text>
      <text x="110" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VM du parc</text>
      <text x="110" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ansible-pull</text>

      <!-- Node: Dépôt Git (external) -->
      <rect x="220" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="220" y="220" width="160" height="64" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <rect x="228" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.22)" stroke-width="0.8"/>
      <text x="242" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
      <text x="300" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dépôt Git</text>
      <text x="300" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tag deploy-*</text>

      <!-- Node: Vérification (security / focal, dashed) -->
      <rect x="420" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="420" y="220" width="160" height="64" rx="6" fill="rgba(46,133,85,0.05)" stroke="#2e8555" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="428" y="228" width="32" height="12" rx="2" fill="transparent" stroke="rgba(46,133,85,0.50)" stroke-width="0.8"/>
      <text x="444" y="237" fill="#2e8555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
      <text x="500" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vérification</text>
      <text x="500" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git verify-tag</text>

      <!-- Node: Playbook Ansible (backend) -->
      <rect x="620" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="620" y="220" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="628" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="642" y="237" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
      <text x="700" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Playbook</text>
      <text x="700" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ansible-playbook</text>

      <!-- Node: Secrets (store) -->
      <rect x="820" y="220" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="820" y="220" width="160" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="828" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="842" y="237" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENC</text>
      <text x="900" y="256" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Secrets</text>
      <text x="900" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SOPS + age local</text>

      <!-- Legend strip -->
      <line x1="40" y1="400" x2="1040" y2="400" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text x="40" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="432" width="14" height="10" rx="2" fill="rgba(46,133,85,0.05)" stroke="#2e8555" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="60" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gate sécurité</text>

      <rect x="200" y="432" width="14" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="220" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

      <rect x="320" y="432" width="14" height="10" rx="2" fill="rgba(28,25,23,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="340" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <rect x="420" y="432" width="14" height="10" rx="2" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <text x="440" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External</text>

      <line x1="540" y1="437" x2="568" y2="437" stroke="#2e8555" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="576" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gate franchie</text>

      <line x1="700" y1="437" x2="728" y2="437" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="736" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Abandon</text>

      <line x1="860" y1="437" x2="888" y2="437" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="896" y="440" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flux normal</text>
    </svg>
  </div>
</body>
</html>
